<!DOCTYPE html>
<head>
<style>
    @font-face {
        font-family: 'ahem';
        src: url('/resources/ahem.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
    }
    span {
        font-family: 'ahem';
    }
</style>
</head>
<body>
    <div id="host"></div>
    <div>I'm not in the shadow DOM (<span>Ahem</span>)</div>
    <script>
        const host = document.querySelector("#host");
        const shadow = host.attachShadow({ mode: "open" });
        const div = document.createElement("div");
        div.innerHTML = "I'm in the shadow DOM (<span>Ahem</span>)";
        shadow.appendChild(div);
        const style = document.createElement("style");
        style.textContent = "span { font-family: 'ahem'; }";
        shadow.appendChild(style);
    </script>
</body>
